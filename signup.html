<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Access | AeroGlow</title>
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="text-white antialiased bg-[#020205] h-screen overflow-hidden relative">

    <div class="fixed top-6 right-6 flex items-center gap-4 z-50">
        <button id="theme-toggle" class="p-2 rounded-full hover:bg-white/10 transition" aria-label="Toggle Theme">
            <i class='bx bx-moon text-xl'></i>
        </button>
        <button id="rtl-toggle" class="hover:text-[#00f0ff] text-sm uppercase font-medium transition">RTL</button>
    </div>

    <div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1534447677768-be436bb09401?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80')] bg-cover bg-center opacity-20 mask-image:linear-gradient(to_bottom,black,transparent) -z-10 mix-blend-screen"></div>
    <div class="absolute top-0 left-0 w-full h-full bg-gradient-to-br from-[#8a2be2]/10 via-transparent to-[#00f0ff]/10 -z-10"></div>

    <div class="flex h-full w-full items-center justify-center p-6 relative z-10 overflow-y-auto">
        
        <div class="w-full max-w-md my-auto">
            
            <!-- Logo -->
            <div class="text-center mb-8">
                <a href="index.html" class="text-3xl font-bold tracking-wider inline-flex items-center gap-2">
                    <i class='bx bx-hive text-[#00f0ff]'></i> <span>Aero<span class="text-gradient">Glow</span></span>
                </a>
                <p class="text-gray-400 text-sm mt-2">Request Agency Access</p>
            </div>

            <!-- Signup Card -->
            <div class="glass-card p-8 rounded-3xl border border-white/10 shadow-[0_0_50px_rgba(0,240,255,0.05)]">
                
                <form class="space-y-4">
                    <div class="space-y-2">
                        <label class="text-xs text-gray-400 uppercase tracking-wider">Full Name</label>
                        <div class="relative">
                            <i class='bx bx-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-500'></i>
                            <input type="text" class="w-full bg-black/50 border border-white/10 rounded-lg pl-10 pr-4 py-3 text-sm focus:outline-none focus:border-[#00f0ff] transition" placeholder="John Doe">
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label class="text-xs text-gray-400 uppercase tracking-wider">Email Address</label>
                        <div class="relative">
                            <i class='bx bx-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-500'></i>
                            <input type="email" class="w-full bg-black/50 border border-white/10 rounded-lg pl-10 pr-4 py-3 text-sm focus:outline-none focus:border-[#00f0ff] transition" placeholder="john@agency.com">
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label class="text-xs text-gray-400 uppercase tracking-wider">Organization</label>
                        <div class="relative">
                            <i class='bx bx-buildings absolute left-4 top-1/2 -translate-y-1/2 text-gray-500'></i>
                            <input type="text" class="w-full bg-black/50 border border-white/10 rounded-lg pl-10 pr-4 py-3 text-sm focus:outline-none focus:border-[#00f0ff] transition" placeholder="Creative Agency Inc.">
                        </div>
                    </div>
                    
                    <div class="space-y-2">
                        <label class="text-xs text-gray-400 uppercase tracking-wider">Password</label>
                        <div class="relative">
                            <i class='bx bx-lock-alt absolute left-4 top-1/2 -translate-y-1/2 text-gray-500'></i>
                            <input type="password" class="w-full bg-black/50 border border-white/10 rounded-lg pl-10 pr-12 py-3 text-sm focus:outline-none focus:border-[#00f0ff] transition" placeholder="••••••••">
                            <i class='bx bx-hide absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 cursor-pointer hover:text-white transition'></i>
                        </div>
                        <div class="flex flex-col gap-3 text-xs">
                            <label class="flex items-start gap-2 cursor-pointer text-gray-400 hover:text-white transition">
                                <input type="checkbox" class="mt-0.5 rounded border-white/10 bg-white/5 text-[#00f0ff] focus:ring-[#00f0ff]" required>
                                <span>I agree to the <a href="#" class="text-[#00f0ff] underline hover:no-underline">Terms of Service</a> and <a href="#" class="text-[#00f0ff] underline hover:no-underline">Privacy Policy</a></span>
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary w-full py-3 mt-4" onclick="event.preventDefault(); window.location.href='dashboard.html'">Create Account</button>
                </form>

                <div class="mt-8">
                    <div class="relative">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-white/10"></div>
                        </div>
                        <div class="relative flex justify-center text-sm">
                            <span class="px-2 bg-[#0d0d12] text-gray-500 rounded-full">Or continue with</span>
                        </div>
                    </div>

                    <div class="mt-6 grid grid-cols-2 gap-4">
                        <button class="w-full flex items-center justify-center gap-2 bg-white/5 border border-white/10 rounded-lg py-2 hover:bg-white/10 transition text-sm">
                            <i class='bx bxl-google text-xl text-white'></i> Google
                        </button>
                        <button class="w-full flex items-center justify-center gap-2 bg-white/5 border border-white/10 rounded-lg py-2 hover:bg-white/10 transition text-sm">
                            <i class='bx bxl-apple text-xl text-white'></i> Apple
                        </button>
                    </div>
                </div>

            </div>

            <p class="text-center text-gray-500 text-sm mt-8">
                Already have an account? <a href="auth.html" class="text-[#00f0ff] hover:underline">Sign In</a>
            </p>

        </div>
    </div>

    <script>
        // Password Visibility Toggle
        document.querySelectorAll('.bx-hide, .bx-show').forEach(icon => {
            icon.addEventListener('click', function() {
                const input = this.parentElement.querySelector('input');
                if (input.type === 'password') {
                    input.type = 'text';
                    this.classList.replace('bx-hide', 'bx-show');
                } else {
                    input.type = 'password';
                    this.classList.replace('bx-show', 'bx-hide');
                }
            });
        });
    </script>
    <script src="assets/js/main.js"></script>

    <!-- Scroll to Top -->
    <button id="scroll-top" title="Scroll to Top">
        <i class="bx bx-up-arrow-alt"></i>
    </button>
</body>
</html>
